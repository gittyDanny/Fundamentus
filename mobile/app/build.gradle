plugins {
    alias(libs.plugins.android.application)

    id 'com.google.gms.google-services'
}

android {
    namespace 'de.daniilioffe.fundamentus'
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        applicationId "de.daniilioffe.fundamentus"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            optimization {
                enable false
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.activity.ktx
    implementation libs.appcompat
    implementation libs.constraintlayout
    implementation libs.material
    testImplementation libs.junit
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.ext.junit

    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'

    // Verwaltet kompatible Versionen der Firebase-Bibliotheken.
    implementation platform('com.google.firebase:firebase-bom:34.15.0')

    // Firebase Authentication für den Login.
    implementation 'com.google.firebase:firebase-auth'

    // Cloud Firestore für Signale, Assets und Nutzerdaten.
    implementation 'com.google.firebase:firebase-firestore'
}